# Application name
spring.application.name=first-backend

# Common JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MySQL settings (activate via: --spring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=blog_admin
spring.datasource.password=blog_admin
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


server.port=8080

